version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: npm
  directory: /apps/web
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    react-runtime-and-types:
      patterns:
      - react
      - react-dom
      - "@types/react"
      - "@types/react-dom"
